# 本地联调用的 profile：起一个真实后端，供 frontend 的 dev server 代理。
#
#   docker run -d --name da-mysql -p 3307:3306 \
#     -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=describeadmin \
#     -e MYSQL_USER=app -e MYSQL_PASSWORD=app \
#     mysql:5.7 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# ⚠️ 仅供本地开发。默认账号 admin / admin123，且每次启动都会执行建表与种子脚本。

server:
  # 8080 在开发机上极易与其他项目撞车，本地 profile 用 8090。
  # 前端通过 VITE_PROXY_TARGET 指向这里，两边保持一致即可
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/describeadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: app
    password: app
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-rbac.sql,classpath:db/schema-biz_project.sql
      # menu-biz_project.sql 由 codegen 生成：没有它，生成的页面在系统里不可达
      data-locations: classpath:db/seed-rbac.sql,classpath:db/menu-biz_project.sql
      # ⚠️ 必须显式指定，否则 Spring 用【平台默认编码】读脚本文件。
      # 中文 Windows 上默认是 GBK，会把 UTF-8 脚本读坏，库里中文全是乱码，
      # 而 COUNT(*) 校验完全正常（CLAUDE.md 3.6）
      encoding: UTF-8

  # 邮箱验证码登录本地联调用的假 SMTP：
  #   docker run -d --name da-mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
  # 发出的验证码邮件在 http://localhost:8025 的 Web UI 里能直接肉眼看到。
  # ⚠️ 生产环境必须替换成真实 SMTP 凭据，不要沿用这一段。
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

describeadmin:
  security:
    # 令牌有效期。本地调试放长一点，免得开着调试器就过期了
    token-ttl: 12h
    # allowed-origins 刻意留空：开发期走 frontend 的 vite dev server 代理，
    # 从根本上不产生跨域，也就不存在「开发期放开的 CORS 被带上生产」这类事故
    permit-all:
      # 邮箱插件自己的发码端点——核心的内置白名单不会包含插件路径（分层硬边界），
      # 不加这一条会直接 401，见 framework-auth-email-starter 的 README
      - /api/auth/email/code
  auth:
    email:
      enabled: true

logging:
  level:
    io.github.describeadmin: DEBUG
