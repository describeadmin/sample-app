spring:
  application:
    name: sample-app

# 框架配置（前缀统一为 describeadmin.<模块>）
describeadmin:
  web:
    trace:
      enabled: true
  mybatis:
    # ⚠️ 不要硬编码在代码里 —— 目标库换成达梦/金仓/OceanBase 时改这里即可
    db-type: MYSQL
    max-limit: 500
  crypto:
    # employee 模块的身份证号 / 手机号加密入库（framework-crypto-starter，AES-256-GCM）。
    # ⚠️ 下面是【示例密钥】，仅供本地/CI 跑通。生产必须用环境变量覆盖：
    #     CRYPTO_AES_KEY / CRYPTO_AES_IDX_KEY —— 各为 `openssl rand -base64 32` 产出。
    # 密钥缺失或长度不对时应用启动期直接失败（不会拖到第一次加密才报错）。
    aes:
      key: ${CRYPTO_AES_KEY:tV2kUXygBhFgZwNBKwhHX9J73TyPNUsJ3xZQ7kVYhOs=}
      blind-index-key: ${CRYPTO_AES_IDX_KEY:F1K3bsyOg+gfiCGEbUmeO8Hm1N1W8DGIj6OK2XfEMZw=}

mybatis-plus:
  global-config:
    db-config:
      # 主键策略：默认自增。需要切雪花时改成 ASSIGN_ID，实体类不用动
      id-type: AUTO
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    # 把 traceId 打进日志，便于与前端/网络日志对应（见 TraceIdFilter）
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
